name: VPN Gate Node Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要 write 权限来回推心跳文件
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          # 多源 SOCKS5 代理池 (补充出口, 与 SSTP 走同一个 Worker)
          SOCKS5_SOURCES: "off"
          VLESS_PROBE: "on"
          VLESS_PROBE_BASE: "https://rentianye25.de5.net/?__probe="
          SOCKS5_MAX: "400"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (build_type=workflow)"
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://movelive04.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'

      # 保活心跳: 每次运行都回推一个时间戳, 让仓库保持活跃,
      # 降低 GitHub 因"仓库长期无提交"而降低 cron 触发率的概率。
      - name: Keepalive heartbeat
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .heartbeat
          git config user.name "gate-bot"
          git config user.email "gate-bot@users.noreply.github.com"
          git add .heartbeat
          if ! git diff --cached --quiet; then
            git commit -m "heartbeat: $(cat .heartbeat)"
            git push
          else
            echo "no change"
          fi
